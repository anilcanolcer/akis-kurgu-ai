name: Windows build and tests

on:
  push:
    branches: ['main', 'experimental/nsis-installer']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ffmpegFile = Get-ChildItem -LiteralPath 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Filter 'ffmpeg.exe' -File -Recurse | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1
          if (-not $ffmpegFile) { throw 'FFmpeg executable not found' }
          $ffmpegFile.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          "AKIS_FFMPEG=$($ffmpegFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-local-ai.txt
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build application
        run: python -m PyInstaller AkisKurguAI.spec --noconfirm --clean
      - name: Verify packaged startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist\AkisKurguAI\AkisKurguAI.exe').Path
          $env:QT_QPA_PLATFORM = 'offscreen'
          $proc = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Application exited at startup: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id
      - name: Check packaged audio backend
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/AkisKurguAI/AkisKurguAI.exe').Path
          $report = Join-Path (Get-Location) 'audio-diagnostic.json'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $proc = Start-Process -FilePath $exe -ArgumentList @('--audio-diagnostic', "`"$report`"") -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Packaged audio diagnostic failed to start' }
          $result = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          Write-Host "Audio diagnostic: $($result.status), reason: $($result.reason)"
          if ($result.status -eq 'failed') { throw 'Packaged audio playback check failed' }
          if ($result.status -eq 'unavailable') { Write-Warning 'No audio backend or output device; real playback test skipped.' }
      - name: Verify packaged Whisper online and offline
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/AkisKurguAI/AkisKurguAI.exe').Path
          $report = Join-Path (Get-Location) 'whisper-diagnostic.json'
          $env:HF_HOME = Join-Path $env:RUNNER_TEMP 'hf-akis-test'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $proc = Start-Process -FilePath $exe -ArgumentList @('--whisper-diagnostic', "`"$report`"") -WindowStyle Hidden -Wait -PassThru
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($proc.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Packaged Whisper test failed' }
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import akis; print(akis.__version__)"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Could not read akis.__version__' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis --yes --no-progress }
          python scripts/generate-nsis-uninstall.py dist/AkisKurguAI dist/uninstall-files.nsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nsis "/DPRODUCT_VERSION=$env:APP_VERSION" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'AkisInstallerTest'
          $setup = (Resolve-Path 'dist/AkisKurguAI-Setup.exe').Path
          $proc = Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$destination") -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or -not (Test-Path (Join-Path $destination 'AkisKurguAI.exe'))) { throw 'Installer verification failed' }
      - name: Verify installer scenarios with a fake application
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          pwsh -NoProfile -File scripts/installer-scenarios.ps1 -MakeNsis $nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify in-place update with the real installer
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'AkisInstallerTest'
          $setup = (Resolve-Path 'dist/AkisKurguAI-Setup.exe').Path
          $env:QT_QPA_PLATFORM = 'offscreen'
          python update_smoke.py $setup $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 3
          Get-Process AkisKurguAI -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
      - name: Verify uninstall preserves user files
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'AkisInstallerTest'
          $sentinel = Join-Path $destination 'user-project.keep'
          Set-Content -LiteralPath $sentinel -Value 'preserve'
          $uninstaller = Join-Path $destination 'Uninstall-Akis.exe'
          $proc = Start-Process -FilePath $uninstaller -ArgumentList @('/S', "_?=$destination") -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or (Test-Path (Join-Path $destination 'AkisKurguAI.exe')) -or -not (Test-Path -LiteralPath $sentinel)) { throw 'Uninstall verification failed' }
      # The artifact service occasionally answers with an error page; one failed upload must not lose a
      # 25-minute build, so wait and try once more before failing the job.
      - name: Upload Windows package
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: AkisKurguAI-Windows-experimental
          path: dist/AkisKurguAI-Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Wait before retrying the upload
        if: steps.upload.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 90
      - name: Upload Windows package (second attempt)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: AkisKurguAI-Windows-experimental
          path: dist/AkisKurguAI-Setup.exe
          if-no-files-found: error
          retention-days: 14
          overwrite: true


  release:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AkisKurguAI-Windows-experimental
          path: package
      - name: Publish experimental installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          gh release view "v$env:APP_VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists'; exit 0 }
          gh release create "v$env:APP_VERSION" 'package/AkisKurguAI-Setup.exe' --target $env:GITHUB_SHA --title "Akış Kurgu AI $env:APP_VERSION" --notes 'Güvenli güncelleme: indirme ilerlemesi, görünür kurulum penceresi, hata olursa eski sürüme geri dönüş; gizli PowerShell yardımcısı kaldırıldı. Hikâye Stüdyosu (Gemini ile metin, görsel ve video), Cloudflare Workers AI sağlayıcısı, İlham fikirleri, geri al/yinele, dışa aktarmada iptal, çökme kurtarma ve çok sayıda hata düzeltmesi. 0.4.2 ve öncesinden geçişte kurucuyu elle indirip çalıştırmanız önerilir. Dijital imzalı değildir; Windows veya güvenlik yazılımınız uyarı gösterebilir. Yerel Whisper modeli ilk kullanımda indirilir.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
