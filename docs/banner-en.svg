<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Akış Kurgu AI — AI-assisted video editor">
  <title>Akış Kurgu AI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1636"/>
      <stop offset=".55" stop-color="#120f22"/>
      <stop offset="1" stop-color="#0b0a14"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6aff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8b6aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fe1c0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4fe1c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c3b2ff"/><stop offset="1" stop-color="#9a80ff"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b6aff"/><stop offset="1" stop-color="#4fe1c0"/></linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a4be8"/><stop offset="1" stop-color="#4a31c4"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d0ff"/></linearGradient>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a5cf5"/><stop offset="1" stop-color="#9a80ff"/></linearGradient>
    <linearGradient id="clipB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb79a"/><stop offset="1" stop-color="#4fe1c0"/></linearGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="190" cy="120" r="330" fill="url(#glowA)"/>
  <circle cx="1090" cy="330" r="300" fill="url(#glowB)"/>

  <!-- Timeline: tracks, clips, waveform and playhead. -->
  <g transform="translate(872 86) scale(.74)">
    <g fill="#ffffff" fill-opacity=".045">
      <rect x="0" y="0" width="520" height="44" rx="10"/>
      <rect x="0" y="56" width="520" height="44" rx="10"/>
      <rect x="0" y="112" width="520" height="44" rx="10"/>
      <rect x="0" y="168" width="520" height="44" rx="10"/>
    </g>
    <g>
      <rect x="10" y="6" width="150" height="32" rx="8" fill="url(#clipA)"/>
      <rect x="168" y="6" width="96" height="32" rx="8" fill="url(#clipA)" fill-opacity=".75"/>
      <rect x="272" y="6" width="190" height="32" rx="8" fill="url(#clipA)"/>
      <rect x="92" y="62" width="120" height="32" rx="8" fill="#5b3be0"/>
      <rect x="300" y="62" width="110" height="32" rx="8" fill="#5b3be0"/>
      <rect x="40" y="118" width="86" height="32" rx="8" fill="#f4f1ff" fill-opacity=".9"/>
      <rect x="218" y="118" width="140" height="32" rx="8" fill="#f4f1ff" fill-opacity=".9"/>
      <rect x="10" y="174" width="452" height="32" rx="8" fill="url(#clipB)" fill-opacity=".28"/>
    </g>
    <g fill="#4fe1c0">
      <rect x="20" y="186" width="5" height="8" rx="2"/><rect x="31" y="181" width="5" height="18" rx="2"/><rect x="42" y="184" width="5" height="12" rx="2"/><rect x="53" y="178" width="5" height="24" rx="2"/><rect x="64" y="183" width="5" height="14" rx="2"/><rect x="75" y="186" width="5" height="8" rx="2"/><rect x="86" y="180" width="5" height="20" rx="2"/><rect x="97" y="177" width="5" height="26" rx="2"/><rect x="108" y="183" width="5" height="14" rx="2"/><rect x="119" y="185" width="5" height="10" rx="2"/><rect x="130" y="179" width="5" height="22" rx="2"/><rect x="141" y="182" width="5" height="16" rx="2"/><rect x="152" y="187" width="5" height="6" rx="2"/><rect x="163" y="181" width="5" height="18" rx="2"/><rect x="174" y="178" width="5" height="24" rx="2"/><rect x="185" y="184" width="5" height="12" rx="2"/><rect x="196" y="180" width="5" height="20" rx="2"/><rect x="207" y="186" width="5" height="8" rx="2"/><rect x="218" y="182" width="5" height="16" rx="2"/><rect x="229" y="177" width="5" height="26" rx="2"/><rect x="240" y="183" width="5" height="14" rx="2"/><rect x="251" y="185" width="5" height="10" rx="2"/><rect x="262" y="179" width="5" height="22" rx="2"/><rect x="273" y="184" width="5" height="12" rx="2"/><rect x="284" y="181" width="5" height="18" rx="2"/><rect x="295" y="186" width="5" height="8" rx="2"/><rect x="306" y="178" width="5" height="24" rx="2"/><rect x="317" y="183" width="5" height="14" rx="2"/><rect x="328" y="180" width="5" height="20" rx="2"/><rect x="339" y="185" width="5" height="10" rx="2"/><rect x="350" y="182" width="5" height="16" rx="2"/><rect x="361" y="177" width="5" height="26" rx="2"/><rect x="372" y="184" width="5" height="12" rx="2"/><rect x="383" y="186" width="5" height="8" rx="2"/><rect x="394" y="180" width="5" height="20" rx="2"/><rect x="405" y="183" width="5" height="14" rx="2"/><rect x="416" y="179" width="5" height="22" rx="2"/><rect x="427" y="185" width="5" height="10" rx="2"/><rect x="438" y="182" width="5" height="16" rx="2"/>
    </g>
    <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1530">
      <text x="52" y="139">Title</text>
      <text x="232" y="139">Captions</text>
    </g>
    <path d="M200 -14 V230" stroke="#f4f1ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M190 -26 H210 V-16 L200 -6 L190 -16 Z" fill="#f4f1ff"/>
  </g>

  <!-- Mark. -->
  <g transform="translate(84 64) scale(.72)">
    <rect x="8" y="8" width="240" height="240" rx="58" fill="#0f0d1c"/>
    <rect x="9.500" y="9.500" width="237" height="237" rx="56.500" fill="none" stroke="#8b6aff" stroke-opacity=".5" stroke-width="3"/>
    <g stroke-width="9" stroke-linejoin="round">
      <path d="M76 52 L142 90 H76 Z" fill="url(#top)" stroke="url(#top)"/>
      <path d="M76 108 H173 L208 128 L173 148 H76 Z" fill="url(#mid)" stroke="url(#mid)"/>
      <path d="M76 166 H142 L76 204 Z" fill="url(#low)" stroke="url(#low)"/>
    </g>
    <path d="M110 44 V214" stroke="#151127" stroke-width="17" stroke-linecap="round"/>
    <path d="M110 54 V212" stroke="#f4f1ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M97 32 H123 V45 L110 58 L97 45 Z" fill="#f4f1ff" stroke="#151127" stroke-width="4" stroke-linejoin="round"/>
    <path d="M192 46 Q194.800 63.200 212 66 Q194.800 68.800 192 86 Q189.200 68.800 172 66 Q189.200 63.200 192 46 Z" fill="#4fe1c0"/>
  </g>

  <!-- Wordmark. -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="300" y="150" font-size="68" font-weight="700" fill="url(#word)" letter-spacing="-1">Akış Kurgu <tspan fill="#4fe1c0">AI</tspan></text>
    <text x="303" y="194" font-size="22" fill="#bdb6d8">AI-assisted, local-first video editor for Windows</text>
    <g font-size="16" font-weight="600">
      <rect x="302" y="228" width="148" height="34" rx="17" fill="#8b6aff" fill-opacity=".18" stroke="#8b6aff" stroke-opacity=".55"/>
      <text x="376" y="250" text-anchor="middle" fill="#d9d0ff">Prompt editing</text>
      <rect x="462" y="228" width="156" height="34" rx="17" fill="#4fe1c0" fill-opacity=".12" stroke="#4fe1c0" stroke-opacity=".5"/>
      <text x="540" y="250" text-anchor="middle" fill="#a8f3e2">Story Studio</text>
    </g>
  </g>
</svg>
